baseURL = "https://fieldnotes-kh.github.io/"
languageCode = "ko-kr"
title = "오늘의 배당·시황 노트"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[params]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  comments = false

  [params.homeInfoParams]
    Title = "오늘의 배당·시황 노트"
    Content = "배당, 배당락일, 시황 등을 쉬운 말로 정리하는 개인 노트입니다."

[[menu.main]]
  identifier = "posts"
  name = "글 목록"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "tags"
  name = "태그"
  url = "/tags/"
  weight = 20

[markup.highlight]
  noClasses = false
