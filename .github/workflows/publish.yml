# 워크플로 이름: GitHub Actions 탭에 표시되는 이름입니다.
name: Publish Hugo site (daily 07:05 KST)

on:
  # ① 매일 한국 시간 오전 7시 5분에 자동 실행합니다.
  #    cron은 UTC 기준이라 한국 시간(UTC+9)에서 9시간을 빼야 합니다.
  #    한국 07:05 = 전날 UTC 22:05 → "5 22 * * *"
  schedule:
    - cron: "5 22 * * *"
  # ② Actions 탭의 "Run workflow" 버튼으로 수동 실행할 수 있게 합니다.
  workflow_dispatch:

# Pages 배포에 필요한 최소 권한만 부여합니다.
permissions:
  contents: read    # 저장소 코드 읽기
  pages: write      # GitHub Pages에 배포
  id-token: write   # 배포 인증(OIDC) 토큰 발급

# 같은 시간에 배포가 겹치지 않도록 한 번에 하나씩만 실행합니다.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # ③-1 사이트를 빌드하는 작업
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.165.0   # 로컬과 같은 Hugo 버전 (PaperMod 최소 요구 버전 이상)
    steps:
      # 1단계: 저장소 코드를 내려받습니다. PaperMod 테마는 submodule이라 recursive가 필요합니다.
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2단계: Hugo(extended 버전)를 설치합니다.
      - name: Hugo 설치
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      # 3단계: GitHub Pages 설정 값(사이트 주소 등)을 읽어옵니다.
      - name: Pages 설정
        id: pages
        uses: actions/configure-pages@v5

      # 4단계: Hugo로 사이트를 빌드해서 public 폴더를 만듭니다.
      #        TZ를 한국 시간으로 맞춰야 오늘 날짜로 예약된 글이 제때 포함됩니다.
      - name: Hugo 빌드
        env:
          HUGO_ENVIRONMENT: production
          TZ: Asia/Seoul
        run: |
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      # 5단계: 빌드 결과물(public 폴더)을 배포용 파일로 묶어서 업로드합니다.
      - name: public 폴더 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # ③-2 빌드 결과물을 GitHub Pages에 배포하는 작업
  deploy:
    needs: build          # build 작업이 성공한 뒤에만 실행합니다.
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 6단계: 업로드된 결과물을 GitHub Pages에 배포합니다.
      # ④ 참고: 아래 액션은 GitHub 공식 Pages 배포 액션으로 가장 널리 쓰이는 방식입니다.
      #    버전(@v4)은 최신이 아닐 수 있으니, GitHub Marketplace에서
      #    "deploy-pages"를 검색해 최신 버전을 확인한 뒤 필요하면 올려주세요.
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
